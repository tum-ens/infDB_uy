[project]
name = "infdb-uy"
version = "0.1.0"
description = "Data download and preparation for applying InfDB to Uruguay (pilot: Cordón, Montevideo)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32",
    "certifi",
    "pyyaml>=6",
    "pandas>=2.2",
    "pyarrow>=16",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "openpyxl>=3.1",
    "libarchive-c>=5.1",
    "laspy[lazrs]>=2.5",
    "pyreadstat>=1.2",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
infdb-uy = "infdb_uy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infdb_uy"]
artifacts = ["src/infdb_uy/dashboard/static/**"]
